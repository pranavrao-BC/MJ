name: Unit Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [next]
    paths:
      - 'package-lock.json'
      - 'packages/**'
      - 'vitest.*'

jobs:
  test:
    name: Run unit tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Compute Turbo filter base (merge-base of HEAD vs target branch)
        id: base
        run: |
          BASE_BRANCH="${{ github.base_ref || 'next' }}"
          git fetch origin "$BASE_BRANCH" --depth=100
          MERGE_BASE=$(git merge-base "origin/$BASE_BRANCH" HEAD 2>/dev/null || true)
          if [ -n "$MERGE_BASE" ]; then
            echo "ref=$MERGE_BASE" >> "$GITHUB_OUTPUT"
            echo "Using merge-base: $MERGE_BASE"
          else
            echo "ref=origin/$BASE_BRANCH" >> "$GITHUB_OUTPUT"
            echo "::warning::merge-base not resolvable in shallow clone; falling back to origin/$BASE_BRANCH (filter may over-match)"
          fi

      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Restore Turbo cache
        id: turbo-cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-${{ github.base_ref || 'next' }}-
            turbo-${{ runner.os }}-

      - name: Create MJExplorer environment file
        run: |
          mkdir -p packages/MJExplorer/src/environments
          cat > packages/MJExplorer/src/environments/environment.ts << 'ENVEOF'
          export const environment = {
            GRAPHQL_URI: "http://localhost:4000",
            GRAPHQL_WS_URI: "ws://localhost:4000",
            REDIRECT_URI: "http://localhost:4200",
            CLIENT_ID: "00000000-0000-0000-0000-000000000000",
            TENANT_ID: "00000000-0000-0000-0000-000000000000",
            CLIENT_AUTHORITY: "https://login.microsoftonline.com/common",
            AUTH_TYPE: "msal" as const,
            NODE_ENV: "test",
            AUTOSAVE_DEBOUNCE_MS: 1200,
            SEARCH_DEBOUNCE_MS: 800,
            MIN_SEARCH_LENGTH: 3,
            MJ_CORE_SCHEMA_NAME: "__mj",
            production: false,
            APPLICATION_NAME: "MJ Explorer CI",
            APPLICATION_INSTANCE: "CI",
            AUTH0_DOMAIN: "",
            AUTH0_CLIENTID: ""
          };
          ENVEOF
          sed -i 's/^          //' packages/MJExplorer/src/environments/environment.ts

      - name: Build affected packages
        env:
          TURBO_CACHE_DIR: .turbo
        run: npx turbo run build --filter="@memberjunction*...[${{ steps.base.outputs.ref }}]" --log-order=stream

      - name: Test affected packages
        env:
          TURBO_CACHE_DIR: .turbo
        run: npx turbo run test --filter="@memberjunction*...[${{ steps.base.outputs.ref }}]" --log-order=stream

      - name: Save Turbo cache
        if: always() && steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
